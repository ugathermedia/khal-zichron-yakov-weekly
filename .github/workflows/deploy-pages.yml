name: Deploy Khal Zichron Yakov Weekly

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync KZY ZmanimScreens data
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          if curl --fail --silent --show-error --location --retry 3 \
            'https://kzy.zmanimscreens.com/api/data' \
            --output "$tmp"; then
            jq -n \
              --arg fetchedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --slurpfile payload "$tmp" \
              '{fetchedAt:$fetchedAt,data:$payload[0]}' > kzy-data.json
          else
            echo "::warning::Live KZY data fetch failed."
            if curl --fail --silent --show-error --location --retry 2 \
              'https://ugathermedia.github.io/khal-zichron-yakov-weekly/kzy-data.json' \
              --output kzy-data.json; then
              echo "Using last deployed KZY snapshot."
            else
              echo "::warning::No previous KZY snapshot available; deploying app in offline schedule mode."
              printf '%s\n' '{"fetchedAt":null,"data":[]}' > kzy-data.json
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
