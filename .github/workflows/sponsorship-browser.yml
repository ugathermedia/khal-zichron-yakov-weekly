name: Verify sponsorship sheet
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/sponsor-browser playwright@1.56.1 pdf-lib@1.17.1
          /tmp/sponsor-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Browser, export, print and API checks
        env:
          NODE_PATH: /tmp/sponsor-browser/node_modules
        run: node tests/sponsorship-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sponsorship-verification
          path: test-results/
